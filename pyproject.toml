[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch"
version = "1.0.0"
description = "Adaptive Web Scraping & Retrieval Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crawlee[playwright,httpx]>=0.4.0",
    "playwright>=1.40.0",
    "httpx[http2]>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.8.0",
    "redis>=5.0.0",
    "zstandard>=0.22.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "selectolax>=0.3.20",
    "trafilatura>=1.8.0",
    "markdownify>=0.11.6",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "jinja2>=3.1.3",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "pypdf>=4.0.0",
    "mcp>=1.1.0,<2.0.0",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0"
]

[project.scripts]
scraper = "scraper.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["scraper/"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
max_stack_depth = 8

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tools/devloop.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = [
    "arg-type",
    "attr-defined",
    "assignment",
    "dict-item",
    "operator",
    "misc",
    "call-arg",
    "union-attr",
    "var-annotated",
    "return-value",
]

[tool.coverage.run]
source = ["scraper"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0


