version: "3.8"

services:
  scraper-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepsearch-api:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/storage/deepsearch.db
      STORAGE_PATH: /data/storage
      API_KEY: ${DEEPSEARCH_API_KEY:-dev-secret}
    volumes:
      - deepsearch-data:/data/storage
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    profiles:
      - storage
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepsearch_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-deepsearch}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    profiles:
      - storage
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  qdrant:
    profiles:
      - storage
    image: qdrant/qdrant:v1.12.8
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  minio:
    profiles:
      - storage
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    command: server /data --console-address "127.0.0.1:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_pass}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  deepsearch-data:
  pg-data:
  qdrant-data:
  minio-data:
