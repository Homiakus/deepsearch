version: "3.8"

services:
  scraper-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/storage/deepsearch.db
      STORAGE_PATH: /data/storage
      API_KEY: dev-secret
    volumes:
      - ./data:/data/storage

  postgres:
    profiles:
      - storage
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deepsearch
      POSTGRES_PASSWORD: deepsearch
      POSTGRES_DB: deepsearch
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    profiles:
      - storage
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    profiles:
      - storage
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  minio:
    profiles:
      - storage
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pg-data:
