name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-quality-and-unit:
    name: Python Lint, Type Check, Unit & Coverage Matrix (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (frozen)
        run: uv sync --all-extras --frozen

      - name: Syntax & Bytecode Compilation Check
        run: uv run python -m compileall scraper

      - name: Ruff Linter
        run: uv run ruff check .

      - name: Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Mypy Static Type Analysis
        run: uv run mypy scraper

      - name: Run Unit & Contract Tests with Coverage
        run: uv run pytest tests/ -v --durations=10 --cov=scraper --cov-report=term-missing

      - name: Run Source Quality Contract Tests
        run: uv run pytest tests/unit/test_quality_report.py tests/unit/test_document_type.py tests/unit/test_candidate_url_policy.py -q

      - name: Validate Search Benchmark Fixtures
        run: >-
          uv run python -c "import json; from pathlib import Path; [json.loads(line) for line in Path('benchmarks/search/source_quality.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]; print('source quality fixtures: ok')"

      - name: Build Wheel and Source Distribution
        run: uv build

      - name: Clean Environment Wheel Installation & CLI Smoke Test
        run: |
          uv venv test-smoke-env
          uv pip install --python test-smoke-env dist/*.whl
          uv run --python test-smoke-env scraper --help
          uv run --python test-smoke-env python -c "import scraper; print('Scraper smoke check: OK')"

  rust-acquisition-worker:
    name: Rust Acquisition Worker (Format, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/acquisition-worker

      - name: Rust Formatter Check
        run: cargo fmt --manifest-path rust/acquisition-worker/Cargo.toml -- --check

      - name: Rust Clippy Check
        run: cargo clippy --manifest-path rust/acquisition-worker/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust Unit & Contract Tests
        run: cargo test --manifest-path rust/acquisition-worker/Cargo.toml --all-targets --all-features

  go-orchestrator:
    name: Go Orchestrator Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: orchestrator/go.sum

      - name: Build Orchestrator
        run: |
          cd orchestrator
          go build ./...

      - name: Run Orchestrator Tests
        run: |
          cd orchestrator
          go test -v -race ./...
